<div class="preview">
  <h1>Muestra del tema · Prime NG v20</h1>
  <p class="subtitle">
    Índice del showcase. Cada componente tiene su propia página con todas sus variantes.
  </p>

  <div class="cards">
    @for (link of links; track link.route) {
    <a class="card" [routerLink]="link.route">
      <span class="material-symbols-outlined card__icon">{{ link.icon }}</span>
      <span class="card__body">
        <span class="card__title">{{ link.title }}</span>
        <span class="card__desc">{{ link.description }}</span>
      </span>
    </a>
    }
  </div>
</div>
