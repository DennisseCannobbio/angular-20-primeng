<div class="preview">
  <h1>Select</h1>
  <p class="subtitle">Componente <code>app-select</code> y todas sus variantes.</p>

  <section>
    <div class="row" style="gap: 2rem; flex-wrap: wrap; align-items: flex-start;">
      @for (v of selectVariants; track v.title) {
      <div class="col" style="flex: 1 1 260px; min-width: 260px;">
        <h3>{{ v.title }}</h3>
        <app-select
          [label]="v.label"
          [options]="selectOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="Selecciona una opción"
          [size]="v.size"
          [variant]="v.variant ?? 'outlined'"
          [fluid]="v.fluid ?? false"
          [loading]="v.loading ?? false"
          [filter]="false"
          [showClear]="v.showClear ?? false"
          [isDisabled]="v.isDisabled ?? false"
          [isInvalid]="v.isInvalid ?? false"
          [required]="v.required ?? false"
          [errorMessage]="v.errorMessage ?? ''"
          [message]="v.message ?? ''"
          [messageSeverity]="v.messageSeverity ?? 'info'"
          [materialIcon]="v.materialIcon ?? ''">
        </app-select>
      </div>
      }

      <div class="col" style="flex: 1 1 260px; min-width: 260px;">
        <h3>Virtual Scroll (10,000 ítems)</h3>
        <app-select label="Data masiva" [options]="virtualScrollOptions" [required]="false"
          placeholder="Busca y scrollea..." optionLabel="label" optionValue="value" [virtualScroll]="true">
        </app-select>
      </div>
    </div>
  </section>
</div>
