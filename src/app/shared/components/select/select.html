<div class="input-container">
  @if (label) {
    <label class="label">
      {{ label }}
      @if (required) {
        <span class="required-asterisk">*</span>
      }
    </label>
  }
  <p-select [options]="options"
      [ngModel]="value"
      (ngModelChange)="onModelChange($event)"
      [size]="size"
      [variant]="variant"
      [fluid]="fluid"
      [loading]="loading"
      [optionValue]="optionValue"
      [optionLabel]="optionLabel"
      [virtualScroll]="virtualScroll"
      [virtualScrollItemSize]="virtualScrollItemSize"
      [scrollHeight]="scrollHeight"
      [appendTo]="appendTo"
      [checkmark]="checkmark"
      [filter]="filter"
      [filterBy]="filterBy"
      [emptyMessage]="emptyMessage"
      [emptyFilterMessage]="emptyFilterMessage"
      [showClear]="showClear"
      [disabled]="disabled"
      [invalid]="isInvalid"
      [placeholder]="placeholder">
    <!-- Spinner de carga con Material Symbols (PrimeIcons no está en el
         proyecto). Reemplaza el loadingIcon por defecto de PrimeNG. -->
    <ng-template #loadingicon>
      <span class="material-symbols-outlined select-loading-icon">progress_activity</span>
    </ng-template>
  </p-select>
  @if (isMessageVisible) {
    <app-message
      [severity]="displaySeverity"
      [variant]="messageVariant"
      [materialIcon]="materialIcon"
      [text]="displayMessage"
      size="small"
    />
  }
</div>
